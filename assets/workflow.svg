  <g transform="translate(380, 60)">
    <rect width="300" height="290" rx="14" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="14" y="14" width="115" height="20" rx="6" fill="#4338ca" fill-opacity="0.35"/>
    <text x="22" y="28" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="800">2. FORGE ENGINE</text>

