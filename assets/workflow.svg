    <text x="26" y="184" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="750">5-Stage Mastery Experience</text>
    <text x="26" y="202" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">🎯 Diagnostic ➔ 📚 Drill ➔ 🔥 Mistakes</text>
    <text x="26" y="220" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">⏱️ Timed Mock with Session Auto-Recovery</text>
    <text x="26" y="238" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">⭐ Bookmarking &amp; 🖨️ Paper Print Mode</text>
    <text x="26" y="256" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="800">🏆 Pass Benchmark Certification Line</text>
  </g>
