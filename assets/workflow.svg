    <text x="26" y="86" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">✦ Zero CDNs, zero servers, zero npm</text>
    <text x="26" y="104" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">✦ 4 Themes (Cyber, Light, Navy, Forest)</text>
    <text x="26" y="122" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">✦ High-Res SVG crest &amp; local progress</text>
    <text x="26" y="140" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="700">✦ Privacy-first localStorage persistence</text>

