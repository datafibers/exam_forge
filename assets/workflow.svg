    <rect x="14" y="14" width="90" height="20" rx="6" fill="#0369a1" fill-opacity="0.35"/>
    <text x="22" y="28" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="800">1. INPUT MODES</text>

    <!-- Mode A Box -->
    <rect x="14" y="46" width="252" height="104" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="26" y="68" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="750">Mode A: Existing Resources</text>
    <text x="26" y="84" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">提供真题/考纲文件</text>
    <text x="26" y="104" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">📄 Past Exam PDFs / Web URLs</text>
    <text x="26" y="122" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">🎯 Verified Blueprints &amp; Official Rules</text>
    <text x="26" y="140" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="700">➜ Curate concepts &amp; distractor logic</text>

    <!-- Mode B Box -->
    <rect x="14" y="162" width="252" height="110" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="26" y="184" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="750">Mode B: Autonomous Search</text>
    <text x="26" y="200" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">无题库全自主检索与命题</text>
    <text x="26" y="220" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">🔍 Search official CED / syllabus</text>
    <text x="26" y="238" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">✍️ Redesign original scenarios (100 Qs)</text>
    <text x="26" y="256" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="700">➜ Anti-hallucination guardrails</text>
  </g>

