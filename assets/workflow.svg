  </g>

  <!-- Flow connecting arrows in background -->
  <path d="M 320 200 L 370 200" stroke="#38bdf8" stroke-width="3" stroke-dasharray="5 5"/>
  <polygon points="375,200 367,195 367,205" fill="#38bdf8"/>

  <path d="M 690 200 L 740 200" stroke="#10b981" stroke-width="3" stroke-dasharray="5 5"/>
  <polygon points="745,200 737,195 737,205" fill="#10b981"/>

  <!-- COLUMN 1: INPUT MODES -->
  <g transform="translate(30, 60)">
