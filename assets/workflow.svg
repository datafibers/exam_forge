    <!-- Engine Step 2 -->
    <rect x="14" y="122" width="272" height="66" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="26" y="144" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="750">Distractor &amp; Shuffle Sync</text>
    <text x="26" y="162" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">✦ Strict why_wrong explanations for all choices</text>
    <text x="26" y="178" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">✦ Permutation remapping (anti-memorization)</text>

    <!-- Engine Step 3 -->
    <rect x="14" y="198" width="272" height="74" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="26" y="220" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="750">Zero-Dependency Compiler</text>
    <text x="26" y="238" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11"><code>validate_bank.py</code>: Schema &amp; Deduplication</text>
    <text x="26" y="254" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11"><code>build_site.py</code>: Single-File HTML Compiler</text>
  </g>

